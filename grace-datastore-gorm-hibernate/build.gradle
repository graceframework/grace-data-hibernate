plugins {
    id 'grace.build.common'
}

configurations {
    shadow {
        transitive = false
    }
    tck {
        transitive = false
    }
    compileClasspath.extendsFrom(shadow)
    testImplementation.extendsFrom(shadow, tck)
}

dependencies {
    shadow project(':grace-spring-orm-hibernate')
    api libs.grace.datastore.core
    api libs.grace.datastore.gorm
    api libs.hibernate.core, {
        exclude group:'org.dom4j', module:'dom4j'
        exclude group:'jakarta.activation', module:'jakarta.activation-api'
        exclude group:'jakarta.annotation', module:'jakarta.annotation-api'
        exclude group:'jakarta.persistence', module:'jakarta.persistence-api'
    }
    api libs.hibernate.validator
    api libs.jakarta.annotation.api
    api libs.jakarta.el
    api libs.jakarta.persistence.api
    api libs.jakarta.validation
    api libs.spring.orm
    implementation libs.javassist
    implementation libs.slf4j.api

    tck libs.grace.datastore.gorm.tck
    testImplementation libs.groovy.json
    testImplementation libs.groovy.sql
    testImplementation libs.jakarta.el
    testImplementation libs.jakarta.validation
    testImplementation libs.ehcache, {
        artifact {
            classifier = 'jakarta'
        }
    }
    testImplementation libs.h2
    testImplementation libs.hibernate.jcache, {
        exclude group: 'org.hibernate', module: 'hibernate-core'
    }
    testImplementation libs.hibernate.validator
    testImplementation libs.logback
    testImplementation libs.tomcat.jdbc
    testRuntimeOnly libs.glassfish.expressly
}

def prepareTckTests = tasks.register('prepareTckTests', Sync) { Sync it ->
    it.inputs.files(configurations.tck)
    it.outputs.upToDateWhen { false }
    it.destinationDirectory = project.layout.buildDirectory.dir('tck')
    it.from zipTree(configurations.tck.singleFile), {
        include '**/*.class'
    }
}

test {
    systemProperty('hibernate5.gorm.suite', System.getProperty('hibernate5.gorm.suite') ?: true)
    dependsOn(prepareTckTests)
    useJUnitPlatform()

    if (isCiBuild) {
        maxParallelForks = 1
        forkEvery = 10
    }
    else {
        maxParallelForks = 1
        forkEvery = 30
    }

    jvmArgs = ['-Xmx2048M']

    testClassesDirs = objects.fileCollection().from(prepareTckTests, testClassesDirs)
}

def prepareShadow = tasks.register('prepareShadow', Sync) { Sync it ->
    it.inputs.files(configurations.shadow)
    it.outputs.upToDateWhen { false }
    it.destinationDirectory = project.layout.buildDirectory.dir('shadow')
    it.from zipTree(configurations.shadow.singleFile), {
        include '**/*.class'
    }
}

jar {
    dependsOn prepareShadow
    from project.layout.buildDirectory.dir('shadow')
}
