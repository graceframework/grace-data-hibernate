plugins {
    id 'groovy'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'examples'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.graceframework:grace-bom:$graceVersion", {
            bomProperties([
                'grace-gorm.version': gormVersion
            ])
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.apache.groovy:groovy'
    implementation "org.graceframework:grace-boot:$graceVersion"
    implementation "org.graceframework:grace-core:$graceVersion"
    implementation "org.graceframework:grace-plugin-core:$graceVersion"
    implementation "org.graceframework:grace-plugin-datasource:$graceVersion"
    implementation project(":hibernate")
    implementation "org.javassist:javassist:3.30.2-GA"
    runtimeOnly 'com.h2database:h2'
    implementation "net.sf.ehcache:ehcache:2.10.6"
    implementation ("org.hibernate:hibernate-ehcache:$hibernateCoreVersion") {
        exclude group:'net.sf.ehcache', module:'ehcache'
        exclude group:'org.hibernate', module:'hibernate-core'
    }
    runtimeOnly "org.jboss.spec.javax.transaction:jboss-transaction-api_1.2_spec:1.1.1.Final"
    testImplementation "org.spockframework:spock-core"
    testImplementation'org.springframework.boot:spring-boot-starter-test'
}
